name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          # the oldest Node the skill declares; the bundle tests run under it
          node-version: 18
      - run: bun install --frozen-lockfile
      # typecheck, test, rebuild the bundle, and fail if the committed bundle is stale
      - run: bun run check
